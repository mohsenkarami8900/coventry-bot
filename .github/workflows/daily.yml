name: Daily GBP price

on:
  schedule:
    # این دیگه تنها راهِ اجرا نیست (پایین رو بخون)، فقط یه بک‌آپِ خیلی کم‌هزینه و
    # رایگانه (ریپو Public شده، پس هزینه‌ی Actions صفره). دیده شده که گیت‌هاب
    # schedule رو گاهی با ساعت‌ها تأخیر، یا حتی اصلاً، اجرا نمی‌کنه - برای همینه که
    # راه‌حلِ اصلیِ «اجرای مطمئن» دیگه این نیست: یه سرویسِ رایگانِ خارجی (مثلاً
    # cron-job.org) هر ۵ دقیقه از ساعت ۱۰:۰۰ تا ۱۰:۳۰ به‌وقت لندن، مستقیماً endpoint
    # زیر رو صدا می‌زنه (workflow_dispatch از طریق REST API گیت‌هاب - این با
    # schedule فرق داره و معمولاً فوری اجرا می‌شه، نه queue/throttle شده):
    #   POST https://api.github.com/repos/mohsenkarami8900/coventry-bot/actions/workflows/daily.yml/dispatches
    # و برای «اگه نرفت به من خبر بده»، یه سرویسِ رایگانِ کاملاً جدا (healthchecks.io)
    # استفاده می‌شه که اگه هر روز یه پینگِ موفقیت ازش نگیره، خودش (نه از طریق
    # گیت‌هاب) مستقیم به تلگرام پیام می‌ده. bot.py این پینگ رو بعد از ارسالِ موفق
    # می‌زنه (ping_healthcheck). جزئیات کامل توی README یا پیامِ راه‌اندازی هست.
    - cron: "*/30 8-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "both (پیام+عکس، همون قیمت) / text (فقط پیام) / image (فقط عکس)"
        default: "both"
      dry_run:
        description: "فقط تست (ارسال نکن) - 0 یعنی ارسال واقعی"
        default: "0"
      force_run:
        description: "نادیده گرفتن وضعیت ارسال‌شده (1 = بله). پیش‌فرض 0 چون این endpoint الان هر ۵ دقیقه از یه سرویس خارجی صدا زده می‌شه؛ last_run.json خودش جلوی ارسال تکراری رو می‌گیره."
        default: "0"
      manual_price_rial:
        description: "قیمت دستی به ریال (اختیاری)"
        default: ""

permissions:
  contents: write   # لازم است تا last_run.json بعد از ارسال واقعی کامیت شود

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian font
        run: sudo apt-get update && sudo apt-get install -y fonts-vazirmatn
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          CHANNEL: "@Coventryexchange"
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          MANUAL_PRICE_RIAL: ${{ github.event.inputs.manual_price_rial }}
        run: python bot.py
      - name: Save last-run state
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_run.json 2>/dev/null)" ]; then
            git config user.name "coventry-bot"
            git config user.email "actions@users.noreply.github.com"
            git add last_run.json
            git commit -m "update last_run state"
            git push
          else
            echo "no state change to commit"
          fi
