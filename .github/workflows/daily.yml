name: Daily GBP price

on:
  schedule:
    # فقط یه تلاشِ خودکار در روز، هدف حوالیِ ۱۰:۰۷ صبح به‌وقت لندن (نه هر چند دقیقه).
    # چون cron گیت‌هاب فقط با UTC کار می‌کنه ولی لندن بین تابستون (BST=UTC+1) و زمستون
    # (GMT=UTC+0) عوض می‌شه، این‌جا دو تا cron گذاشتیم - یکی برای هر فصل - تا همیشه یکیشون
    # دقیقاً روی ۱۰:۰۷ لندن هدف‌گذاری بشه. توجه: گیت‌هاب گاهی اجرای schedule رو دیر انجام
    # می‌ده (حتی چند ساعت) - bot.py دیگه هیچ بازه‌ی ساعتی‌ای چک نمی‌کنه، یعنی هر اجرایی که
    # واقعاً شروع بشه (هر ساعتی) ارسال می‌کنه؛ last_run.json جلوی ارسال تکراریِ دو کرون رو
    # می‌گیره. اگه گیت‌هاب امروز هیچ اجرایی نداشته باشه، خودت دستی از این صفحه اجرا کن.
    - cron: "7 10 * * *"   # = ۱۰:۰۷ لندن در زمستون (GMT)
    - cron: "7 9 * * *"    # = ۱۰:۰۷ لندن در تابستون (BST)
  workflow_dispatch:
    inputs:
      mode:
        description: "both (پیام+عکس، همون قیمت) / text (فقط پیام) / image (فقط عکس)"
        default: "both"
      dry_run:
        description: "فقط تست (ارسال نکن) - 0 یعنی ارسال واقعی"
        default: "0"
      force_run:
        description: "نادیده گرفتن وضعیت ارسال‌شده (1 = بله). پیش‌فرض 0 کافیه: last_run.json خودش جلوی ارسال تکراری رو می‌گیره، پس اگه خودت دستی اجرا کنی و قبلاً نرفته باشه، همین دکمه بدون تغییر هیچی کافیه."
        default: "0"
      manual_price_rial:
        description: "قیمت دستی به ریال (اختیاری)"
        default: ""

permissions:
  contents: write   # لازم است تا last_run.json بعد از ارسال واقعی کامیت شود

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian font
        run: sudo apt-get update && sudo apt-get install -y fonts-vazirmatn
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL: "@Coventryexchange"
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          MANUAL_PRICE_RIAL: ${{ github.event.inputs.manual_price_rial }}
        run: python bot.py
      - name: Save last-run state
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_run.json 2>/dev/null)" ]; then
            git config user.name "coventry-bot"
            git config user.email "actions@users.noreply.github.com"
            git add last_run.json
            git commit -m "update last_run state"
            git push
          else
            echo "no state change to commit"
          fi
