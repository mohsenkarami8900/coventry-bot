name: Daily GBP price

on:
  schedule:
    # دیدیم که گیت‌هاب گاهی زمان‌بندی (schedule) رو با چند ساعت تأخیر اجرا می‌کنه
    # (یه روز تا ساعت ۱۶-۱۷ لندن، یعنی حدود ۷ ساعت دیر!). برای همین به‌جای چند فرصتِ
    # پراکنده در طول روز، هر ۳۰ دقیقه یه‌بار چک می‌کنیم؛ هر چه زودتر گیت‌هاب اجرا کرد
    # (حتی با تأخیر)، همون موقع پیام/عکس می‌ره.
    #
    # ساعت‌ها به‌وقت UTC هستن (۸ تا ۲۱ یعنی تقریباً ۹ تا ۲۲ لندن، هم زمستان هم تابستان).
    # چون bot.py دقیقاً ساعت ۱۰ رو چک نمی‌کنه (بلکه بازه‌ی ۹ تا ۲۲ لندن)، یه بازه‌ی
    # UTC ثابت برای هر دو فصل کار می‌کنه. و چون bot.py وضعیت ارسال هر روز رو توی
    # last_run.json نگه می‌داره، هر چندتا از این‌ها که اجرا بشن، پیام/عکس فقط یک‌بار
    # فرستاده می‌شه (همون اولین باری که واقعاً اجرا بشه). اگه تا ساعت ۱۲ لندن
    # (ALERT_HOUR توی bot.py) هنوز چیزی نرفته باشه، خودِ ربات یه پیام هشدار با
    # لینک اجرای دستی برای ادمین می‌فرسته.
    - cron: "*/30 8-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "both (پیام+عکس، همون قیمت) / text (فقط پیام) / image (فقط عکس)"
        default: "both"
      dry_run:
        description: "فقط تست (ارسال نکن) - 0 یعنی ارسال واقعی"
        default: "0"
      force_run:
        description: "نادیده گرفتن ساعت 10 و وضعیت ارسال‌شده (1 = بله)"
        default: "1"
      manual_price_rial:
        description: "قیمت دستی به ریال (اختیاری)"
        default: ""

permissions:
  contents: write   # لازم است تا last_run.json بعد از ارسال واقعی کامیت شود

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian font
        run: sudo apt-get update && sudo apt-get install -y fonts-vazirmatn
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL: "@Coventryexchange"
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          MANUAL_PRICE_RIAL: ${{ github.event.inputs.manual_price_rial }}
        run: python bot.py
      - name: Save last-run state
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_run.json 2>/dev/null)" ]; then
            git config user.name "coventry-bot"
            git config user.email "actions@users.noreply.github.com"
            git add last_run.json
            git commit -m "update last_run state"
            git push
          else
            echo "no state change to commit"
          fi
